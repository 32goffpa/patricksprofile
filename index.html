
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Settings</title>

<style>
:root {
  --blue: #3478f6;
  --sidebar: #ecebea;
  --text: #1c1c1e;
  --secondary: #77777b;
  --card: #f5f5f5;
  --line: #e5e5e5;
  --window: #ffffff;
  --accent: #3478f6;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
    Arial, sans-serif;
  color: var(--text);
  background: #111;
}

button, input, select {
  font: inherit;
}

button { cursor: pointer; }

.app {
  width: 100%;
  height: 100vh;
  min-height: 600px;
  display: grid;
  grid-template-columns: 30% 70%;
  overflow: hidden;
  background: white;
}

.sidebar {
  background: var(--sidebar);
  border-right: 1px solid #d2d2d2;
  padding: 15px 15px 8px;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
}

.traffic {
  height: 62px;
  display: flex;
  gap: 14px;
  padding: 12px 8px;
  flex-shrink: 0;
}

.traffic span {
  height: 22px;
  width: 22px;
  border-radius: 50%;
  display: block;
}

.red { background: #ff605c; }
.yellow { background: #ffbd44; }
.green { background: #00ca4e; }

.search-wrap {
  position: relative;
  margin: 13px 0 15px;
  flex-shrink: 0;
}

.search {
  height: 45px;
  width: 100%;
  border-radius: 25px;
  border: 1px solid #d4d4d4;
  padding: 0 15px;
  background: linear-gradient(#f9f9f9, #e9e9e9);
  outline: none;
  font-size: 17px;
  box-shadow: inset 0 1px 2px #00000008;
}

.search:focus {
  border-color: #9ebcff;
}

.search-results {
  display: none;
  position: absolute;
  z-index: 30;
  top: 49px;
  left: 0;
  right: 0;
  background: #fffffff2;
  backdrop-filter: blur(20px);
  border: 1px solid #ddd;
  border-radius: 13px;
  box-shadow: 0 8px 28px #0002;
  padding: 5px;
  max-height: 300px;
  overflow: auto;
}

.search-results button {
  display: flex;
  align-items: center;
  width: 100%;
  border: none;
  background: transparent;
  padding: 9px;
  border-radius: 8px;
  text-align: left;
  gap: 10px;
}

.search-results button:hover {
  background: #e6e6e6;
}

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 10px 20px;
  flex-shrink: 0;
}

.avatar {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  flex-shrink: 0;
  background:
    radial-gradient(ellipse at 50% 100%, #ffdaa0 0%, transparent 65%),
    linear-gradient(180deg, #66506f 0%, #f6a184 55%, #f7d9a2 100%);
  border: 1px solid #d0d0d0;
}

.profile-name {
  font-weight: 650;
  font-size: 19px;
}

.profile-sub {
  color: #686868;
  font-size: 16px;
  margin-top: 3px;
}

.nav {
  overflow-y: auto;
  min-height: 0;
  scrollbar-width: thin;
  scrollbar-color: #c7c7c7 transparent;
}

.nav-group {
  margin-bottom: 14px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 13px;
  width: 100%;
  height: 43px;
  padding: 5px 11px;
  margin: 2px 0;
  border: 0;
  border-radius: 10px;
  color: #151515;
  background: transparent;
  text-align: left;
  font-size: 17px;
  white-space: nowrap;
  transition: background .15s, color .15s;
}

.nav-item:hover { background: #ffffff91; }

.nav-item.active {
  background: var(--blue);
  color: white;
  font-weight: 650;
}

.nav-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
  flex-shrink: 0;
  box-shadow: inset 0 1px 1px #ffffff45, 0 1px 2px #0002;
}

.content {
  min-width: 0;
  height: 100%;
  overflow-y: auto;
  background: white;
}

.topbar {
  height: 82px;
  display: flex;
  align-items: center;
  padding: 0 13px;
  gap: 20px;
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 10;
  background: #ffffffed;
  backdrop-filter: blur(20px);
}

.backgroup {
  height: 54px;
  width: 118px;
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  border: 1px solid #e1e1e1;
  border-radius: 30px;
  flex-shrink: 0;
}

.backgroup button {
  border: 0;
  background: transparent;
  font-size: 34px;
  line-height: 1;
  color: #555;
}

.backgroup button:disabled {
  color: #c7c7c7;
  cursor: default;
}

.page-title {
  font-size: 24px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
}

.page {
  padding: 25px 30px 45px;
}

.page h1 {
  margin: 0 0 6px;
  font-size: 27px;
  letter-spacing: -.5px;
}

.subtitle {
  color: var(--secondary);
  font-size: 14px;
  margin: 0 0 23px;
  line-height: 1.5;
}

.wallpaper-top {
  display: grid;
  grid-template-columns: minmax(140px, 253px) minmax(0, 1fr);
  gap: 16px;
  margin-bottom: 34px;
}

.hero-art {
  min-height: 158px;
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  background: linear-gradient(145deg, #514743, #e8d7bd 26%, #786e68 42%, #282c45 74%, #a9b7c5);
}

.hero-art::before {
  content: "";
  position: absolute;
  inset: -25%;
  background:
    linear-gradient(145deg, transparent 22%, #f8ead4 25%, #867668 30%,
    transparent 34%, #dfcfb4 41%, #f9e9d3 44%, #36374a 50%,
    transparent 56%, #b6c2d1 67%, #34384c 76%);
  transform: rotate(-7deg);
}

.hero-art::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, #ffffff08);
}

.feature-controls {
  border-radius: 17px;
  background: #f6f6f6;
  padding: 0 15px;
}

.feature-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 58px;
  border-bottom: 1px solid #e2e2e2;
  font-size: 16px;
}

.feature-line:last-child { border-bottom: none; }

.feature-line select {
  border: 0;
  background: transparent;
  max-width: 100px;
  padding: 5px;
}

.feature-actions {
  display: flex;
  gap: 9px;
  justify-content: flex-end;
  margin-top: 13px;
  flex-wrap: wrap;
}

.feature-actions button,
.action-btn {
  background: #ededed;
  border: none;
  border-radius: 9px;
  padding: 10px 12px;
  transition: background .15s;
}

.feature-actions button:hover,
.action-btn:hover { background: #dfdfdf; }

.switch {
  width: 56px;
  height: 29px;
  border: none;
  border-radius: 20px;
  background: #d1d1d6;
  padding: 3px;
  flex-shrink: 0;
  transition: background .18s;
}

.switch::after {
  content: "";
  display: block;
  width: 23px;
  height: 23px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 1px 3px #0003;
  transition: transform .18s;
}

.switch.on { background: #34c759; }
.switch.on::after { transform: translateX(27px); }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.section-title {
  font-size: 19px;
  font-weight: 650;
  margin: 30px 0 14px;
}

.section-head .section-title { margin-top: 0; }

.show-all {
  color: #818181;
  border: none;
  background: transparent;
  font-size: 14px;
  white-space: nowrap;
}

.show-all:hover { color: var(--blue); }

.gallery {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.wall-card {
  min-width: 0;
  border: 2px solid transparent;
  border-radius: 8px;
  padding: 0;
  background: white;
  overflow: hidden;
  text-align: center;
  color: #222;
  transition: transform .16s, border-color .16s;
}

.wall-card:hover { transform: translateY(-2px); }

.wall-card.selected {
  border-color: var(--blue);
}

.wall-art {
  height: 110px;
  border-radius: 5px;
  position: relative;
  overflow: hidden;
}

.wall-art::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, #ffffff30, transparent 45%, #00000010);
}

.gold {
  background: linear-gradient(145deg, #6e6254, #f3e1c6 24%, #817568 34%, #30364d 62%, #aeb9c8);
}

.tahoe {
  background: linear-gradient(180deg, #b1d9ed, #f3d9b2 40%, #52b7db 47%, #1d58b8 75%, #18265c);
}

.sequoia {
  background: linear-gradient(125deg, #ffb0b0, #f77d9d 30%, #ef6ca9 42%, #615ad5 70%, #49c3dc);
}

.macintosh {
  background: repeating-linear-gradient(135deg, #c8c8ca 0 9px, #8f9096 10px 12px, #ddd 13px 23px);
}

.sunset {
  background: linear-gradient(180deg, #7d83a7, #f5b58b 45%, #e6b783 56%, #6c7789 57%, #263b54);
}

.ocean {
  background: linear-gradient(180deg, #5792c5, #d6e3e9 43%, #42b4cc 48%, #18547e 78%, #24455f);
}

.forest {
  background: repeating-linear-gradient(88deg, #203d32 0 12px, #52785a 13px 19px, #b3a57f 20px 23px, #193b2d 24px 37px);
}

.mountain {
  background: linear-gradient(180deg, #a6c7e3, #d9c7ae 43%, #688b78 57%, #314f42 76%);
}

.wall-name {
  font-size: 14px;
  padding: 6px 2px 5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.photo-tile {
  width: 170px;
  max-width: 100%;
  height: 112px;
  border: 0;
  border-radius: 8px;
  background: #f3f3f3;
  color: #888;
  font-size: 14px;
}

.photo-tile:hover { background: #eaeaea; }

.settings-card {
  border-radius: 15px;
  overflow: hidden;
  background: #f6f6f6;
}

.setting-row {
  min-height: 65px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 12px 15px;
  border-bottom: 1px solid #e1e1e1;
  transition: background .15s;
}

.setting-row:last-child { border-bottom: 0; }
.setting-row:hover { background: #ededed; }

.setting-copy { flex: 1; min-width: 0; }
.setting-name { font-size: 16px; }
.setting-desc { font-size: 12px; color: #777; margin-top: 4px; }

.control {
  max-width: 165px;
  min-width: 80px;
  border: 1px solid #d6d6d6;
  border-radius: 8px;
  background: white;
  padding: 7px;
  color: #222;
}

.range-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.range {
  width: 100px;
  accent-color: var(--blue);
}

.range-value {
  color: #666;
  font-size: 12px;
  min-width: 32px;
}

.note {
  background: #edf4ff;
  color: #48628b;
  border-radius: 10px;
  padding: 12px;
  font-size: 12px;
  margin-top: 22px;
  line-height: 1.5;
}

.empty-state {
  padding: 35px 15px;
  text-align: center;
  color: #777;
}

@media (min-width: 1200px) {
  .app { grid-template-columns: 340px minmax(0, 1fr); }
}

@media (max-width: 900px) {
  .app { grid-template-columns: 250px minmax(0, 1fr); }
  .sidebar { padding-left: 10px; padding-right: 10px; }
  .nav-item { font-size: 15px; gap: 9px; }
  .page { padding: 22px 17px 35px; }
  .wallpaper-top { grid-template-columns: 1fr; }
  .hero-art { min-height: 140px; }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

@media (max-width: 540px) {
  .app { grid-template-columns: 60px minmax(0, 1fr); }
  .sidebar { padding: 8px 5px; }
  .traffic { padding: 8px 4px; height: 46px; gap: 4px; }
  .traffic span { width: 12px; height: 12px; }
  .search { padding: 0 7px; font-size: 12px; }
  .profile { justify-content: center; padding: 0 0 15px; }
  .avatar { width: 35px; height: 35px; }
  .profile-copy, .nav-text { display: none; }
  .nav-item { justify-content: center; padding: 3px 0; height: 37px; }
  .nav-icon { width: 28px; height: 28px; font-size: 17px; }
  .topbar { height: 61px; gap: 9px; padding: 0 8px; }
  .backgroup { width: 72px; height: 39px; }
  .page-title { font-size: 18px; }
  .page { padding: 16px 10px 25px; }
  .page h1 { font-size: 23px; }
  .setting-row { padding: 10px 8px; gap: 8px; }
  .setting-name { font-size: 13px; }
  .setting-desc { font-size: 11px; }
  .control { min-width: 65px; max-width: 110px; font-size: 11px; }
  .range { width: 60px; }
  .wall-art { height: 78px; }
  .feature-line { font-size: 13px; }
  .feature-actions button { font-size: 11px; padding: 8px; }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="traffic">
      <span class="red"></span>
      <span class="yellow"></span>
      <span class="green"></span>
    </div>

    <div class="search-wrap">
      <input class="search" id="search" type="search"
        placeholder="⌕  Search" autocomplete="off">
      <div class="search-results" id="results"></div>
    </div>

    <div class="profile">
      <div class="avatar"></div>
      <div class="profile-copy">
        <div class="profile-name">Danny Rico</div>
        <div class="profile-sub">Apple Account</div>
      </div>
    </div>

    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="content" id="content">
    <header class="topbar">
      <div class="backgroup">
        <button id="back" aria-label="Go back" disabled>‹</button>
        <button id="forward" aria-label="Go forward" disabled>›</button>
      </div>
      <div class="page-title" id="topTitle">Wallpaper</div>
    </header>

    <div class="page" id="page"></div>
  </main>

</div>

<script>
"use strict";

/* SETTINGS CATEGORIES */

const groups = [
  [
    ["Wi-Fi", "⌁", "#398df3"],
    ["Bluetooth", "ᛒ", "#398df3"],
    ["Network", "◎", "#398df3"],
    ["VPN", "◉", "#398df3"],
    ["Battery", "▰", "#64c76c"]
  ],
  [
    ["General", "⚙", "#8f9298"],
    ["Accessibility", "♙", "#378cf3"],
    ["Appearance", "◐", "#08090a"],
    ["Desktop & Dock", "▣", "#25272b"],
    ["Displays", "☼", "#378cf3"],
    ["Menu Bar", "☷", "#93969c"],
    ["Siri", "◒", "#777"],
    ["Spotlight", "⌕", "#92969e"],
    ["Wallpaper", "❀", "#4cb6e8"],
    ["Screen Saver", "◌", "#4c9ebc"],
    ["Notifications", "▣", "#eea13a"],
    ["Sound", "◖", "#e9a13a"],
    ["Focus", "◐", "#7766e8"],
    ["Screen Time", "◷", "#8e70df"],
    ["Apple Intelligence", "✦", "#8e65d8"],
    ["Lock Screen", "▣", "#7d8ba1"],
    ["Privacy & Security", "▤", "#5b9b7a"],
    ["Touch ID & Password", "◉", "#777d8a"],
    ["Users & Groups", "♙", "#6f91cf"],
    ["Internet Accounts", "◎", "#6e9bd4"],
    ["Game Center", "♧", "#8e70d9"],
    ["Keyboard", "⌨", "#9296a0"],
    ["Trackpad", "▱", "#9296a0"],
    ["Mouse", "⌖", "#9296a0"],
    ["Printers & Scanners", "▤", "#9296a0"],
    ["Storage", "▥", "#8e95a1"],
    ["Time Machine", "◴", "#6b9ad4"],
    ["Date & Time", "◷", "#858b96"],
    ["Language & Region", "文", "#9296a0"],
    ["Sharing", "↗", "#6d9cce"],
    ["Software Update", "↓", "#5e9dce"]
  ]
];

const descriptions = {
  "Wi-Fi": "Connect to wireless networks.",
  "Bluetooth": "Connect accessories and nearby devices.",
  "Network": "Manage network connections and services.",
  "VPN": "Manage VPN configurations.",
  "Battery": "View battery and energy settings.",
  "General": "Manage general system preferences.",
  "Accessibility": "Customize accessibility features.",
  "Appearance": "Choose the appearance of your Mac.",
  "Desktop & Dock": "Customize your desktop and Dock.",
  "Displays": "Adjust display settings and brightness.",
  "Menu Bar": "Choose which controls appear in the menu bar.",
  "Siri": "Configure Siri preferences.",
  "Spotlight": "Customize search results.",
  "Wallpaper": "Choose a picture for your desktop.",
  "Screen Saver": "Choose a screen saver.",
  "Notifications": "Manage app notifications.",
  "Sound": "Configure sound input and output.",
  "Focus": "Choose a Focus mode.",
  "Screen Time": "Review app and website activity.",
  "Apple Intelligence": "Manage intelligent features.",
  "Lock Screen": "Customize lock screen settings.",
  "Privacy & Security": "Manage permissions and security.",
  "Touch ID & Password": "Manage authentication settings.",
  "Users & Groups": "Manage user accounts.",
  "Internet Accounts": "Manage online accounts.",
  "Game Center": "Manage gaming preferences.",
  "Keyboard": "Customize keyboard settings.",
  "Trackpad": "Configure gestures and tracking.",
  "Mouse": "Adjust pointer and scrolling.",
  "Printers & Scanners": "Manage printers and scanners.",
  "Storage": "Review storage usage.",
  "Time Machine": "Configure backup preferences.",
  "Date & Time": "Configure date and time.",
  "Language & Region": "Choose language and regional formats.",
  "Sharing": "Choose services to share.",
  "Photos": "Choose your personal wallpaper photos."
};

const items = groups.flat();
const state = { wallpaper: "Golden Gate" };
let current = "Wallpaper";
let history = ["Wallpaper"];
let historyIndex = 0;

const $ = id => document.getElementById(id);

function getItem(name) {
  return items.find(item => item[0] === name) || [name, "⚙", "#9296a0"];
}

/* SIDEBAR */

function buildNav() {
  $("nav").innerHTML = groups.map(group =>
    `<div class="nav-group">${group.map(([name, icon, color]) =>
      `<button class="nav-item ${name === current ? "active" : ""}"
        data-page="${name}" title="${name}">
        <span class="nav-icon" style="background:${color}">${icon}</span>
        <span class="nav-text">${name}</span>
      </button>`
    ).join("")}</div>`
  ).join("");

  $("nav").querySelectorAll("[data-page]").forEach(button => {
    button.addEventListener("click", () => go(button.dataset.page));
  });
}

function go(name, addHistory = true) {
  if (!descriptions[name]) return;

  if (addHistory && name !== current) {
    history = history.slice(0, historyIndex + 1);
    history.push(name);
    historyIndex = history.length - 1;
  }

  current = name;
  buildNav();
  render();

  $("back").disabled = historyIndex === 0;
  $("forward").disabled = historyIndex === history.length - 1;
  $("results").style.display = "none";
  $("search").value = "";
  $("content").scrollTop = 0;
}

function moveHistory(direction) {
  const index = historyIndex + direction;
  if (index < 0 || index >= history.length) return;

  historyIndex = index;
  current = history[index];
  buildNav();
  render();

  $("back").disabled = historyIndex === 0;
  $("forward").disabled = historyIndex === history.length - 1;
  $("content").scrollTop = 0;
}

$("back").addEventListener("click", () => moveHistory(-1));
$("forward").addEventListener("click", () => moveHistory(1));

/* REUSABLE SETTINGS CONTROLS */

function toggle(key, defaultValue = false) {
  const value = state[key] === undefined ? defaultValue : state[key];

  return `<button class="switch ${value ? "on" : ""}"
    data-toggle="${key}" data-default="${defaultValue}"
    aria-label="${key}" aria-pressed="${value}"></button>`;
}

function select(key, options, defaultValue) {
  const value = state[key] ?? defaultValue;

  return `<select class="control" data-select="${key}">
    ${options.map(option =>
      `<option value="${option}" ${value === option ? "selected" : ""}>${option}</option>`
    ).join("")}
  </select>`;
}

function slider(key, defaultValue, min = 0, max = 100) {
  const value = state[key] ?? defaultValue;

  return `<div class="range-wrap">
    <input class="range" type="range" min="${min}" max="${max}"
      value="${value}" data-range="${key}">
    <span class="range-value" data-value="${key}">${value}%</span>
  </div>`;
}

function row(title, description, control) {
  const [, symbol, color] = getItem(current);

  return `<div class="setting-row">
    <span class="nav-icon" style="background:${color}">${symbol}</span>
    <div class="setting-copy">
      <div class="setting-name">${title}</div>
      ${description ? `<div class="setting-desc">${description}</div>` : ""}
    </div>
    ${control}
  </div>`;
}

function card(title, rows) {
  return `<div class="section-title">${title}</div>
    <div class="settings-card">${rows.join("")}</div>`;
}

/* WALLPAPER GALLERIES */

const wallpapers = [
  ["Golden Gate", "gold"],
  ["Tahoe", "tahoe"],
  ["Sequoia", "sequoia"],
  ["Macintosh", "macintosh"],
  ["Golden Gate Sunset", "sunset"],
  ["Tahoe Day", "ocean"],
  ["Sequoia Sunrise", "forest"],
  ["Sonoma Horizon", "mountain"]
];

function wall(name, style) {
  return `<button class="wall-card ${state.wallpaper === name ? "selected" : ""}"
    data-wall="${name}" aria-label="Choose ${name} wallpaper">
    <div class="wall-art ${style}"></div>
    <div class="wall-name">${name}</div>
  </button>`;
}

function wallpaperPage() {
  const chosen = state.wallpaper || "Golden Gate";

  return `
    <div class="wallpaper-top">
      <div class="hero-art" title="${chosen} wallpaper preview"></div>

      <div>

/* RENDER THE CURRENT PAGE */

function render() {
  $("topTitle").textContent = current;

  let output = "";

  if (current === "Wallpaper") {
    output = wallpaperPage();
  } else {
    output = getSettingsPage();

    output += `<div class="note">
      Interactive website demo. These controls change the visual demo only;
      they do not change settings on your actual Mac.
    </div>`;
  }

  $("page").innerHTML = `
    <h1>${current}</h1>
    <p class="subtitle">${descriptions[current] || "Manage your settings."}</p>
    ${output}
  `;

  attachEvents();
}

/* INTERACTIVE CONTROLS */

function attachEvents() {
  $("page").querySelectorAll("[data-toggle]").forEach(button => {
    button.addEventListener("click", () => {
      const key = button.dataset.toggle;
      const defaultValue = button.dataset.default === "true";
      const currentValue = state[key] === undefined
        ? defaultValue
        : state[key];

      state[key] = !currentValue;
      render();
    });
  });

  $("page").querySelectorAll("[data-select]").forEach(selectBox => {
    selectBox.addEventListener("change", () => {
      state[selectBox.dataset.select] = selectBox.value;

      if (selectBox.dataset.select === "wallStyle") {
        render();
      }
    });
  });

  $("page").querySelectorAll("[data-range]").forEach(range => {
    range.addEventListener("input", () => {
      state[range.dataset.range] = Number(range.value);

      const value = $("page").querySelector(
        `[data-value="${range.dataset.range}"]`
      );

      if (value) value.textContent = range.value + "%";
    });
  });

  $("page").querySelectorAll("[data-wall]").forEach(button => {
    button.addEventListener("click", () => {
      state.wallpaper = button.dataset.wall;
      render();
    });
  });

  $("page").querySelectorAll("[data-go]").forEach(button => {
    button.addEventListener("click", () => go(button.dataset.go));
  });

  $("page").querySelectorAll("[data-theme]").forEach(button => {
    button.addEventListener("click", () => {
      const theme = button.dataset.theme;

      if (theme === "Dark") {
        document.documentElement.style.setProperty("--sidebar", "#29292b");
        document.documentElement.style.setProperty("--text", "#f5f5f7");
        document.documentElement.style.setProperty("--secondary", "#aaa");
        document.documentElement.style.setProperty("--card", "#333336");
        document.documentElement.style.setProperty("--line", "#444");
        document.documentElement.style.setProperty("--window", "#222");
        $("content").style.background = "#222";
        $("page").style.background = "#222";
        $("page").style.color = "#f5f5f7";
        document.querySelectorAll(".settings-card").forEach(card => {
          card.style.background = "#333336";
        });
      } else {
        document.documentElement.style.setProperty("--sidebar", "#ecebea");
        document.documentElement.style.setProperty("--text", "#1c1c1e");
        document.documentElement.style.setProperty("--secondary", "#77777b");
        document.documentElement.style.setProperty("--card", "#f5f5f5");
        document.documentElement.style.setProperty("--line", "#e5e5e5");
        document.documentElement.style.setProperty("--window", "#ffffff");
        $("content").style.background = "white";
        $("page").style.background = "white";
        $("page").style.color = "#1c1c1e";
        document.querySelectorAll(".settings-card").forEach(card => {
          card.style.background = "#f6f6f6";
        });
      }

      if (theme === "Auto") {
        document.documentElement.style.setProperty("--sidebar", "#ecebea");
      }
    });
  });

  $("page").querySelectorAll("[data-focus]").forEach(button => {
    button.addEventListener("click", () => {
      state.focus = button.dataset.focus;
      render();
    });
  });

  $("page").querySelectorAll("[data-action]").forEach(button => {
    button.addEventListener("click", () => handleAction(button.dataset.action));
  });
}

function handleAction(action) {
  const messages = {
    clock: "Clock Appearance settings demo.",
    dynamic: "All dynamic wallpaper previews are shown in this demo.",
    landscape: "All landscape wallpaper previews are shown in this demo.",
    photo: "To use a real photo, add an image file to your repository and connect it to the wallpaper preview.",
    network: "Network details demo.",
    vpn: "VPN configuration demo.",
    about: "About This Mac · macOS Sequoia Demo.",
    privacy: "Search privacy settings demo.",
    account: "Account management demo.",
    addUser: "User creation demo.",
    printer: "Printer management demo.",
    backup: "Choose a backup disk demo.",
    update: "Your demo is up to date!",
    "enabled": "Setting updated."
  };

  alert(messages[action] || "This is a visual settings demo. This control does not change real macOS settings.");
}

/* LIVE SEARCH */

$("search").addEventListener("input", () => {
  const query = $("search").value.trim().toLowerCase();
  const results = $("results");

  if (!query) {
    results.style.display = "none";
    return;
  }

  const matches = items.filter(item =>
    (item[0] + " " + (descriptions[item[0]] || ""))
      .toLowerCase()
      .includes(query)
  ).slice(0, 9);

  if (!matches.length) {
    results.innerHTML = `<div class="empty-state">No settings found</div>`;
  } else {
    results.innerHTML = matches.map(([name, symbol, color]) =>
      `<button data-find="${name}">
        <span class="nav-icon" style="background:${color}">${symbol}</span>
        <span>${name}</span>
      </button>`
    ).join("");
  }

  results.style.display = "block";

  results.querySelectorAll("[data-find]").forEach(button => {
    button.addEventListener("click", () => go(button.dataset.find));
  });
});

document.addEventListener("click", event => {
  if (!event.target.closest(".search-wrap")) {
    $("results").style.display = "none";
  }
});

/* STARTUP */

buildNav();
render();
